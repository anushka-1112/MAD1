<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign</title>
</head>
<body>
    <form action="/assign/{{exam_id}}" method="post">
    <label for="examiner_id">Examiner To Be Assigned</label>
    <select name="examiner_id">
    {% for examiner in examiners %}
    <option selected value="{{ examiner.user_id }}">{{ examiner.user_name }}</option>
    {% endfor %}
    </select>
    <input type="submit" value="Assign">
    </form>
</body>
</html>
