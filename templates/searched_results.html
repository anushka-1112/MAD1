<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
</head>
<body>
    <h4>Examiners</h4>
    {% for examiner in users %}
        {% if examiner.role == 'examiner' %}
            {{ examiner.user_name }}&nbsp;
        {% endif %}
    {% endfor %}

    <h4>Students</h4>
    {% for student in users %}
        {% if student.role == 'student' %}
            {{ student.user_name }}
        {% endif %}
    {% endfor %}
</body>
</html>
