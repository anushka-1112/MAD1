<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit course</title>
</head>
<body>
    <form method="post" action="/edit_courses/{{ user.user_name }}/{{ course.course_id }}">
        <input type="hidden" name="user_details" value="{{ user.user_name }}">
        <label for="course_name"> Course Name</label>
        <input type="text" name="course_name" value="{{ course.course_name }}"><br>
        <label for="course_code"> Course Code</label>
        <input type="text" name="course_code" value="{{ course.course_code }}" required><br>
        <label for="description"> Description</label>
        <input type="text" name="description" value="{{ course.description }}"><br>
        <input type="submit" value="Edit Course">
    </form>
</body>
</html>
